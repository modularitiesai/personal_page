<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">AI interview topic map</title>
  <desc id="desc">A structured map connecting implementation, transformer internals, numerical stability, distributed systems, and inference serving.</desc>
